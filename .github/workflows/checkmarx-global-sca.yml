name: Checkmarx One Scan with SCA Resolver (reusable)

on:
  workflow_call:
    inputs:
      project_name:        { type: string, default: "" }
      branch:              { type: string, default: "" }
      global_params:       { type: string, default: "" }
      scan_params:         { type: string, default: "" }
      utils_params:        { type: string, default: "" }
      results_params:      { type: string, default: "" }
      repo_name:           { type: string, default: "" }
      namespace:           { type: string, default: "" }
      pr_number:           { type: string, default: "" }
      source_dir:          { type: string, default: "." }
      runs_on:             { type: string, default: "ubuntu-latest" }
      sca_resolver:        { type: string, default: "" }   # path to binary; empty = use var or default
      sca_resolver_params: { type: string, default: "" }
      sca_resolver_url:    { type: string, default: "" }   # override download URL if needed
    secrets:
      CX_CLIENT_ID:     { required: true }
      CX_CLIENT_SECRET: { required: true }

jobs:
  checkmarx:
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
      pull-requests: write
    env:
      SCA_RESOLVER:        ${{ inputs.sca_resolver        || vars.CX_SCA_RESOLVER        || './ScaResolver' }}
      SCA_RESOLVER_PARAMS: ${{ inputs.sca_resolver_params || vars.CX_SCA_RESOLVER_PARAMS }}
      SCA_RESOLVER_URL:    ${{ inputs.sca_resolver_url    || vars.CX_SCA_RESOLVER_URL    || 'https://sca-downloads.s3.amazonaws.com/cli/latest/ScaResolver-linux64.tar.gz' }}
      BASE_SCAN_PARAMS:    ${{ inputs.scan_params         || vars.CX_SCAN_PARAMS }}
    steps:
      - uses: actions/checkout@v4

      - name: Download SCA Resolver
        run: |
          mkdir -p "$(dirname "$SCA_RESOLVER")"
          curl -sSL --fail -o resolver.tar.gz "$SCA_RESOLVER_URL"
          tar -xzf resolver.tar.gz
          mv ScaResolver "$SCA_RESOLVER"
          chmod +x "$SCA_RESOLVER"
          "$SCA_RESOLVER" --version || true

      - name: Assemble scan params
        id: params
        run: |
          OUT="$BASE_SCAN_PARAMS --sca-resolver $SCA_RESOLVER"
          if [ -n "$SCA_RESOLVER_PARAMS" ]; then
            OUT="$OUT --sca-resolver-params \"$SCA_RESOLVER_PARAMS\""
          fi
          echo "value=$OUT" >> "$GITHUB_OUTPUT"
          echo "Final scan_params: $OUT"

      - name: Checkmarx AST GitHub Action
        uses: Checkmarx/ast-github-action@2.3.36
        with:
          base_uri:          ${{ vars.CX_BASE_URI }}
          cx_tenant:         ${{ vars.CX_TENANT }}
          cx_client_id:      ${{ secrets.CX_CLIENT_ID }}
          cx_client_secret:  ${{ secrets.CX_CLIENT_SECRET }}

          project_name:      ${{ inputs.project_name || github.repository }}
          branch:            ${{ inputs.branch || github.head_ref || github.ref }}
          github_token:      ${{ github.token }}

          global_params:     ${{ inputs.global_params  || vars.CX_GLOBAL_PARAMS }}
          scan_params:       ${{ steps.params.outputs.value }}
          utils_params:      ${{ inputs.utils_params   || vars.CX_UTILS_PARAMS }}
          results_params:    ${{ inputs.results_params || vars.CX_RESULTS_PARAMS }}

          repo_name:         ${{ inputs.repo_name || github.event.repository.name }}
          namespace:         ${{ inputs.namespace || github.repository_owner }}
          pr_number:         ${{ inputs.pr_number || github.event.number }}
          source_dir:        ${{ inputs.source_dir }}
